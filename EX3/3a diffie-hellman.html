<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diffie-Hellman Key Exchange</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background: #007bff;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    .note {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Diffie-Hellman Key Exchange</h1>

    <label for="p">Prime p:</label>
    <input type="number" id="p" value="23" />

    <label for="g">Primitive root g:</label>
    <input type="number" id="g" value="5" />

    <label for="a">Alice private key a:</label>
    <input type="number" id="a" value="6" />

    <label for="b">Bob private key b:</label>
    <input type="number" id="b" value="15" />

    <div class="buttons">
      <button onclick="calculateDH()">Calculate</button>
    </div>

    <label for="output">Output:</label>
    <textarea id="output" rows="10" readonly></textarea>

    <div class="note">
      This demonstrates public values and shared secret calculation.
    </div>
  </div>

  <script>
    function modPow(base, exp, mod) {
      let result = 1;
      base = base % mod;
      while (exp > 0) {
        if (exp % 2 === 1) result = (result * base) % mod;
        base = (base * base) % mod;
        exp = Math.floor(exp / 2);
      }
      return result;
    }

    function calculateDH() {
      const p = parseInt(document.getElementById("p").value);
      const g = parseInt(document.getElementById("g").value);
      const a = parseInt(document.getElementById("a").value);
      const b = parseInt(document.getElementById("b").value);

      const A = modPow(g, a, p);
      const B = modPow(g, b, p);
      const sharedAlice = modPow(B, a, p);
      const sharedBob = modPow(A, b, p);

      let output = "";
      output += `Step 1: Public values p = ${p}, g = ${g}\n`;
      output += `Step 2: Alice private key a = ${a}\n`;
      output += `Step 3: Bob private key b = ${b}\n`;
      output += `Step 4: Alice computes A = g^a mod p = ${g}^${a} mod ${p} = ${A}\n`;
      output += `Step 5: Bob computes B = g^b mod p = ${g}^${b} mod ${p} = ${B}\n`;
      output += `Step 6: Alice computes shared secret = B^a mod p = ${B}^${a} mod ${p} = ${sharedAlice}\n`;
      output += `Step 7: Bob computes shared secret = A^b mod p = ${A}^${b} mod ${p} = ${sharedBob}\n`;

      document.getElementById("output").value = output;
    }
  </script>
</body>
</html>
