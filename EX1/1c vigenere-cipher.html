<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigenère Cipher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background: #007bff;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    .note {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vigenère Cipher</h1>

    <label for="text">Text:</label>
    <textarea id="text" rows="4" placeholder="Enter plaintext or ciphertext"></textarea>

    <label for="key">Key:</label>
    <input type="text" id="key" value="KEY" placeholder="Enter keyword" />

    <div class="buttons">
      <button onclick="encryptVigenere()">Encrypt</button>
      <button onclick="decryptVigenere()">Decrypt</button>
    </div>

    <label for="output">Output:</label>
    <textarea id="output" rows="4" readonly></textarea>
  </div>

  <script>
    function extendKey(text, key) {
      key = key.toUpperCase().replace(/[^A-Z]/g, "");
      let result = "";
      let j = 0;

      for (let ch of text) {
        if (ch >= "A" && ch <= "Z") {
          result += key[j % key.length];
          j++;
        } else {
          result += ch;
        }
      }
      return result;
    }

    function vigenereEncrypt(text, key) {
      text = text.toUpperCase();
      let fullKey = extendKey(text, key);
      let result = "";

      for (let i = 0; i < text.length; i++) {
        let ch = text[i];
        if (ch >= "A" && ch <= "Z") {
          let p = ch.charCodeAt(0) - 65;
          let k = fullKey[i].charCodeAt(0) - 65;
          result += String.fromCharCode(((p + k) % 26) + 65);
        } else {
          result += ch;
        }
      }

      return result;
    }

    function vigenereDecrypt(text, key) {
      text = text.toUpperCase();
      let fullKey = extendKey(text, key);
      let result = "";

      for (let i = 0; i < text.length; i++) {
        let ch = text[i];
        if (ch >= "A" && ch <= "Z") {
          let c = ch.charCodeAt(0) - 65;
          let k = fullKey[i].charCodeAt(0) - 65;
          result += String.fromCharCode(((c - k + 26) % 26) + 65);
        } else {
          result += ch;
        }
      }

      return result;
    }

    function encryptVigenere() {
      const text = document.getElementById("text").value;
      const key = document.getElementById("key").value;
      document.getElementById("output").value = vigenereEncrypt(text, key);
    }

    function decryptVigenere() {
      const text = document.getElementById("text").value;
      const key = document.getElementById("key").value;
      document.getElementById("output").value = vigenereDecrypt(text, key);
    }
  </script>
</body>
</html>
