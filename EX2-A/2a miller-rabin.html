<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miller-Rabin Primality Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background: #007bff;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    .note {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Miller-Rabin Primality Test</h1>

    <label for="n">Number:</label>
    <input type="number" id="n" value="17" />

    <label for="rounds">Rounds:</label>
    <input type="number" id="rounds" value="5" />

    <div class="buttons">
      <button onclick="testPrime()">Test</button>
    </div>

    <label for="output">Output:</label>
    <textarea id="output" rows="8" readonly></textarea>

    <div class="note">
      Note: Miller-Rabin is a probabilistic primality test.
    </div>
  </div>

  <script>
    function modPow(base, exp, mod) {
      let result = 1;
      base = base % mod;

      while (exp > 0) {
        if (exp % 2 === 1) {
          result = (result * base) % mod;
        }
        base = (base * base) % mod;
        exp = Math.floor(exp / 2);
      }

      return result;
    }

    function millerRabin(n, k) {
      let steps = "";

      if (n <= 1) return { prime: false, steps: "Numbers <= 1 are not prime." };
      if (n <= 3) return { prime: true, steps: `${n} is prime.` };
      if (n % 2 === 0) return { prime: false, steps: `${n} is even, so it is composite.` };

      let d = n - 1;
      let s = 0;

      while (d % 2 === 0) {
        d /= 2;
        s++;
      }

      steps += `${n} - 1 = 2^${s} × ${d}\n\n`;

      for (let i = 0; i < k; i++) {
        let a = 2 + Math.floor(Math.random() * (n - 4));
        let x = modPow(a, d, n);

        steps += `Round ${i + 1}:\n`;
        steps += `a = ${a}\n`;
        steps += `x = ${a}^${d} mod ${n} = ${x}\n`;

        if (x === 1 || x === n - 1) {
          steps += `Pass this round.\n\n`;
          continue;
        }

        let continueLoop = false;

        for (let r = 1; r < s; r++) {
          x = (x * x) % n;
          steps += `x = x^2 mod ${n} = ${x}\n`;

          if (x === n - 1) {
            steps += `Pass this round.\n\n`;
            continueLoop = true;
            break;
          }

          if (x === 1) {
            steps += `Composite found.\n\n`;
            return { prime: false, steps };
          }
        }

        if (!continueLoop) {
          steps += `Composite found.\n\n`;
          return { prime: false, steps };
        }
      }

      steps += `Probably prime after ${k} rounds.`;
      return { prime: true, steps };
    }

    function testPrime() {
      const n = parseInt(document.getElementById("n").value);
      const rounds = parseInt(document.getElementById("rounds").value);

      const result = millerRabin(n, rounds);
      document.getElementById("output").value =
        (result.prime ? "Probably Prime\n\n" : "Composite\n\n") + result.steps;
    }
  </script>
</body>
</html>
