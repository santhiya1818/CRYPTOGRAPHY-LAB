<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCD Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background: #007bff;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GCD Calculator</h1>

    <label for="num1">Number 1:</label>
    <input type="number" id="num1" value="48" />

    <label for="num2">Number 2:</label>
    <input type="number" id="num2" value="18" />

    <button onclick="calculateGCD()">Calculate GCD</button>

    <label for="output">Output:</label>
    <textarea id="output" rows="6" readonly></textarea>
  </div>

  <script>
    function calculateGCD() {
      let a = parseInt(document.getElementById("num1").value);
      let b = parseInt(document.getElementById("num2").value);
      let steps = "";

      while (b !== 0) {
        steps += `${a} = ${b} × ${Math.floor(a / b)} + ${a % b}\n`;
        let temp = b;
        b = a % b;
        a = temp;
      }

      steps += `\nGCD = ${a}`;
      document.getElementById("output").value = steps;
    }
  </script>
</body>
</html>
